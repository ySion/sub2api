name: Build and Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sub2api-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${REPO}"
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "sha=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.latest }}
            ${{ steps.image.outputs.sha }}
          build-args: |
            COMMIT=${{ github.sha }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REF: ${{ steps.image.outputs.latest }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/root/sub2api' }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE_REF,DEPLOY_DIR,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            printf '%s\n' \
              'services:' \
              '  sub2api:' \
              "    image: ${IMAGE_REF}" \
              '    environment:' \
              '      - HTTP_PROXY=${SUB2API_HTTP_PROXY:-}' \
              '      - HTTPS_PROXY=${SUB2API_HTTPS_PROXY:-}' \
              '      - NO_PROXY=${SUB2API_NO_PROXY:-localhost,127.0.0.1,postgres,redis,sub2api}' \
              '      - http_proxy=${SUB2API_HTTP_PROXY:-}' \
              '      - https_proxy=${SUB2API_HTTPS_PROXY:-}' \
              '      - no_proxy=${SUB2API_NO_PROXY:-localhost,127.0.0.1,postgres,redis,sub2api}' \
              > docker-compose.prod.yml
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull sub2api
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps sub2api
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
